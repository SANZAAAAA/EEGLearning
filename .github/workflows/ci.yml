name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 先装 CPU 版 torch（PyPI 默认是 CUDA 版，体积大很多）
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mne numpy scipy scikit-learn pandas matplotlib

      - name: 语法与导入检查
        run: |
          python -m compileall -q eegnet train_eegnet.py tests
          python -c "import eegnet; print('eegnet', eegnet.__version__)"

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: CLI 可用性
        run: python train_eegnet.py --help

  smoke-train:
    name: 真实数据冒烟训练
    # 只在手动触发时运行：会下载 1 名被试的数据并训练 20 轮
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 下载 1 名被试并训练
        run: |
          python train_eegnet.py \
            --subjects 1 --max-per-class 10 --epochs 20 --cv 2 --out results

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/**/summary.csv
          if-no-files-found: warn
